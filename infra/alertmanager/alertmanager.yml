# ==============================================================================
# Alertmanager Configuration
# ==============================================================================
# For production, configure a real receiver (PagerDuty, Slack, email, etc.)
# The webhook_configs below points to a local receiver for development.

global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
      receiver: 'default-receiver'
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: 'default-receiver'
      repeat_interval: 1h

receivers:
  - name: 'default-receiver'
    webhook_configs:
      # Replace with a real endpoint (Slack incoming webhook, PagerDuty, etc.)
      # For development/testing: use https://webhook.site or a local receiver
      - url: 'http://host.docker.internal:9091/alert'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
