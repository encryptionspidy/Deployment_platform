# ==============================================================================
# Grafana Auto-Provisioned Dashboard Provider
# ==============================================================================
apiVersion: 1

providers:
  - name: "deploy-platform-dashboards"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
