global:
  scrape_interval: 15s

rule_files:
  - "recording-rules.yml"
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['host.docker.internal:9093']

scrape_configs:
  - job_name: 'metrics-exporter'
    static_configs:
      - targets: ['host.docker.internal:8001']