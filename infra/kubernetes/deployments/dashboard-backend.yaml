# ==============================================================================
# dashboard-backend — Kubernetes Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: deploy-platform
  labels:
    app: dashboard-backend
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
        - name: dashboard-backend
          image: deploy-platform/dashboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: SESSION_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: ENCRYPTION_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dashboard-backend-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: REDIS_PORT
            - name: PROMETHEUS_URL
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: PROMETHEUS_URL
            - name: WEBHOOK_TARGET_URL
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: WEBHOOK_TARGET_URL
            - name: ENABLE_DEMO_LOGIN
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: deploy-platform
spec:
  selector:
    app: dashboard-backend
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  type: ClusterIP
