# ==============================================================================
# webhook-receiver — Kubernetes Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: deploy-platform
  labels:
    app: webhook-receiver
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
        - name: webhook-receiver
          image: deploy-platform/webhook-receiver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: webhook-receiver-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: deploy-platform-config
                  key: REDIS_PORT
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: deploy-platform
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
