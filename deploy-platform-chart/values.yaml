# ==============================================================================
# deploy-platform-chart — Default Values
# ==============================================================================
# Override these with: helm install my-release ./deploy-platform-chart -f custom-values.yaml

appName: deploy-platform-app
namespace: deploy-platform
replicaCount: 1

image:
  repository: ""           # REQUIRED: e.g. my-registry/my-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

containerPort: 3000

# Ingress (disabled by default — enable for production)
ingress:
  enabled: false
  host: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUPercent: 70

# Health check paths (override for services that use different paths)
healthCheck:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10

# Environment variables injected into the container
# Use secretRef / configMapRef for sensitive values in production
env: []
# - name: MY_VAR
#   value: "my-value"
# - name: SECRET_VAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: my-key
